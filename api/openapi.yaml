openapi: 3.1.0
info:
  title: Shop API
  version: 1.0.0
  description: >-
    Catalog, cart, coupons and orders of the Shop demo. All amounts are integer cents.
    Errors are always {"error": {"code": "...", "message": "..."}}.
servers:
  - url: /
paths:
  /api/products:
    get:
      operationId: listProducts
      summary: List or search products with cursor pagination
      parameters:
        - name: search
          in: query
          description: Case-insensitive text to look for in product names.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor from the previous page's next_cursor.
          schema:
            type: string
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/products/{id}:
    get:
      operationId: getProduct
      summary: Get one product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cart:
    get:
      operationId: getCart
      summary: The caller's cart with totals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The cart. It is created on first use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/cart/items:
    post:
      operationId: addCartItem
      summary: Add units of a product to the cart
      description: >-
        Adds to the quantity already in the cart, up to 99 units per product.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddItemRequest"
      responses:
        "201":
          description: The updated cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cart/items/{product_id}:
    patch:
      operationId: setCartItemQuantity
      summary: Set the quantity of a product in the cart; 0 removes it
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetQuantityRequest"
      responses:
        "200":
          description: The updated cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cart/coupon:
    post:
      operationId: applyCoupon
      summary: Apply a coupon to the cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyCouponRequest"
      responses:
        "200":
          description: The cart with the discount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The coupon is unknown, expired, below its minimum total or not valid for these products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/checkout:
    post:
      operationId: checkout
      summary: Turn the cart into an order and queue the charge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: The created order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Not enough stock for an item. Nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The coupon does not apply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/orders:
    get:
      operationId: listOrders
      summary: The caller's orders, newest first (at most 100)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/orders/{id}:
    get:
      operationId: getOrder
      summary: One of the caller's orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/openapi.yaml:
    get:
      operationId: getSpec
      summary: This document
      responses:
        "200":
          description: The OpenAPI spec.
          content:
            application/yaml:
              schema:
                type: string
  /api/docs:
    get:
      operationId: getDocs
      summary: Swagger UI for this document
      responses:
        "200":
          description: An HTML page.
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request is malformed or a value is out of range.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The bearer token is missing, expired or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    Product:
      type: object
      required: [id, sku, name, description, price_cents, image_url, stock, created_at]
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price_cents:
          type: integer
          format: int64
        image_url:
          type: string
        stock:
          type: integer
        created_at:
          type: string
          format: date-time
    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.
    CartItem:
      type: object
      required: [product_id, sku, name, unit_price_cents, quantity, line_total_cents]
      properties:
        product_id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        unit_price_cents:
          type: integer
          format: int64
        quantity:
          type: integer
        line_total_cents:
          type: integer
          format: int64
    Cart:
      type: object
      required: [items, coupon_code, subtotal_cents, discount_cents, total_cents]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        coupon_code:
          type: [string, "null"]
        subtotal_cents:
          type: integer
          format: int64
        discount_cents:
          type: integer
          format: int64
        total_cents:
          type: integer
          format: int64
    AddItemRequest:
      type: object
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    SetQuantityRequest:
      type: object
      required: [quantity]
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 99
          description: 0 removes the item.
    ApplyCouponRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          examples: [WELCOME10]
    Card:
      type: object
      required: [number, exp, cvc]
      additionalProperties: false
      properties:
        number:
          type: string
          pattern: "^[0-9]{12,19}$"
        exp:
          type: string
          examples: ["12/29"]
        cvc:
          type: string
          pattern: "^[0-9]{3,4}$"
    CheckoutRequest:
      type: object
      required: [currency, card]
      additionalProperties: false
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          examples: [USD]
        card:
          $ref: "#/components/schemas/Card"
        coupon_code:
          type: string
          description: A coupon to use for this order instead of the one on the cart.
    OrderItem:
      type: object
      required: [product_id, name, unit_price_cents, quantity]
      properties:
        product_id:
          type: integer
          format: int64
        name:
          type: string
        unit_price_cents:
          type: integer
          format: int64
        quantity:
          type: integer
    Order:
      type: object
      required: [id, status, currency, subtotal_cents, discount_cents, total_cents, coupon_code, created_at, items]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, paid, failed]
        currency:
          type: string
        subtotal_cents:
          type: integer
          format: int64
        discount_cents:
          type: integer
          format: int64
        total_cents:
          type: integer
          format: int64
        coupon_code:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
